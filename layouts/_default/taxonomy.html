{{ define "content" }}
<section class="blog-index">
  <header class="blog-index-head">
    <h1>{{ if eq .Data.Plural "tags" }}#{{ .Title }}{{ else }}{{ .Title }}{{ end }}</h1>
  </header>
  {{ $paginator := .Paginate .Pages.ByDate.Reverse }}
  {{ range $paginator.Pages }}{{ partial "blog-entry.html" . }}{{ end }}
</section>
{{ partial "pagination.html" . }}
{{ end }}
