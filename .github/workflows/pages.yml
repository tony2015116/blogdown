name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo Extended
        env:
          HUGO_VERSION: '0.92.0'
          HUGO_SHA256: c025201508ac9a44d5c461713f4d416eabb1dee45c9df3de0d634a167e2e2fbd
        run: |
          archive="$RUNNER_TEMP/hugo.tar.gz"
          tools_dir="$RUNNER_TEMP/hugo-bin"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gohugoio/hugo/releases/download/v$HUGO_VERSION/hugo_extended_${HUGO_VERSION}_Linux-64bit.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$HUGO_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tools_dir" hugo
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Build blog
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          HUGO_CANONIFYURLS: 'true'
        run: |
          hugo --baseURL "${PAGES_BASE_URL%/}/"
          test -s public/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
