baseURL: https://blog.mguo.dpdns.org/
title: MGUO 的博客
enableRobotsTXT: true
enableEmoji: true
theme: hugo-theme-jane
# hasCJKLanguage: yes
pagination:
  pagerSize: 30
rssLimit: 20
copyright: ''


ignoreFiles:
  - '\.Rmd$'
  - '\.Rmarkdown$'
  - '_cache$'
  - '\.(knit|utf8)\.md$'
  - '\.lock~$'

permalinks:
  post: /:year/:month/:day/:slug/



taxonomies:
  tag: tags
  category: categories
  series: series


#defaultContentLanguage: en
defaultContentLanguage: zh-cn
locale: zh-cn

sitemap:
  changefreq: weekly
  priority: 0.5
  filename: sitemap.xml

menu:
  main:
    - identifier: home
      name: 主页
      url: ./
      weight: 10
    - identifier: archives
      name: 归档
      url: post/
      weight: 20
    - identifier: tags
      name: 标签
      url: tags/
      weight: 30
    - identifier: categories
      name: 分类
      url: categories/
      weight: 40

params:
  authorInfo:
    name: 郭猛
  customCSS: ['custom.css'] #'douban.css' #'sspai.css'
  customJS: []
  dateFormatToUse: '2006-01-02'

  photoswipe: false
  #rssFullContent: yes
  homeFullContent: false
  
  since: '2022'
  
  mathjax: false
  katex: false
  
  moreMeta: false
  
  baidu_push: true        # baidu push                  # 百度
  baidu_analytics: ""      # Baidu Analytics
  baidu_verification: ""   # Baidu Verification
  google_verification: ""  # Google_Verification         # 谷歌
  
  
  counter:
    busuanzi:
      enable: false

  social:
    a-email: mailto:tony2015116@163.com
    g-github: https://github.com/tony2015116
    i-zhihu: https://www.zhihu.com/people/guo-meng-68-41
    c-twitter: https://twitter.com/tonyituite
    #d-facebook: "http://localhost:1313"
    e-linkedin: https://www.linkedin.cn/incareer/in/%E7%8C%9B-%E9%83%AD-71a51711a
    #c-twitter: http://localhost:1313
    #q-bilibili: http://localhost:1313
    #t-youtube: http://localhost:1313
  
  showAuthorInfo: false
  
  toc: false                                                                            # 是否开启目录
  autoCollapseToc: false   # Auto expand and collapse toc                              # 目录自动展开/折叠
  fancybox: false           # see https://github.com/fancyapps/fancybox                 # 是否启用fancybox（图片可点击）
  
  #forkMeOnGithub: "https://github.com/tony2015116/blogdown"


markup:
  defaultMarkdownHandler: goldmark
  highlight:
    noClasses: false
    lineNos: true
  goldmark:
    renderer:
      unsafe: true
